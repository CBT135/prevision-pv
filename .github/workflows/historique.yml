name: Reprise d'historique

# À lancer une fois à la mise en service d'un site (onglet Actions > Reprise d'historique > Run workflow).
# Reconstitue le modèle à partir des prévisions météo archivées et le compare aux mesures,
# pour que la correction soit active dès le premier jour.
on:
  workflow_dispatch:
    inputs:
      jours:
        description: "Nombre de jours à reprendre (365 max conseillé)"
        default: "90"
        required: true

permissions:
  contents: write

concurrency:
  group: prevision-pv
  cancel-in-progress: false

jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reprise
        env:
          ENPHASE_API_KEY: ${{ secrets.ENPHASE_API_KEY }}
          ENPHASE_CLIENT_ID: ${{ secrets.ENPHASE_CLIENT_ID }}
          ENPHASE_CLIENT_SECRET: ${{ secrets.ENPHASE_CLIENT_SECRET }}
          ENPHASE_REFRESH_TOKEN: ${{ secrets.ENPHASE_REFRESH_TOKEN }}
          ENPHASE_REFRESH_TOKEN_SORTIE: ${{ runner.temp }}/enphase_refresh_token
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          ENEDIS_SGE_CERT: ${{ secrets.ENEDIS_SGE_CERT }}
          ENEDIS_SGE_KEY: ${{ secrets.ENEDIS_SGE_KEY }}
          ENEDIS_SGE_P12: ${{ secrets.ENEDIS_SGE_P12 }}
          ENEDIS_SGE_P12_MDP: ${{ secrets.ENEDIS_SGE_P12_MDP }}
          ENEDIS_SGE_LOGIN: ${{ secrets.ENEDIS_SGE_LOGIN }}
          ENEDIS_SGE_CONTRAT: ${{ secrets.ENEDIS_SGE_CONTRAT }}
        run: |
          set -o pipefail
          mkdir -p data
          python -m prevpv.run historique --jours "${{ inputs.jours }}" 2>&1 | tee data/journal_reprise_historique.log
      - name: Réenregistrer le jeton Enphase s'il a changé
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          f="$RUNNER_TEMP/enphase_refresh_token"
          [ -s "$f" ] && [ -n "$GH_TOKEN" ] && gh secret set ENPHASE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" || true
      - name: Publier
        if: always()
        run: |
          git config user.name "prevision-pv[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data docs/data
          git add -A data docs/data config/sites.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reprise d'historique (${{ inputs.jours }} jours)"
          # Un autre calcul ou un enregistrement de la base a pu publier entre-temps : les fichiers
          # de résultats générés ici étant les plus récents, ils l'emportent en cas de conflit.
          for essai in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 10))
          done
          exit 1
