name: Calcul quotidien

on:
  schedule:
    # Heures en UTC (hiver : +1 h à Paris ; été : +2 h).
    # GitHub retarde souvent les calculs programmés de plusieurs heures : chaque créneau est doublé.
    # Les passages supplémentaires ne refont rien d'inutile (réalisé déjà calculé ignoré,
    # prévision J+1 simplement remplacée par une version plus récente).
    # Matin : mesures de la veille (Enphase, Enedis, dépôts) et prévision J+1, à rendre avant 7 h.
    # Plusieurs passages entre 3 h et 6 h 30 (heure d'hiver de Paris ; 4 h - 7 h 30 en été) : Enedis
    # publie la courbe de la veille au fil de la nuit, et GitHub décale souvent les passages.
    # Un passage qui n'a plus rien à récupérer ne fait que remettre à jour la prévision.
    - cron: "7 2 * * *"
    - cron: "37 2 * * *"
    - cron: "7 3 * * *"
    - cron: "37 3 * * *"
    - cron: "7 4 * * *"
    - cron: "37 4 * * *"
    - cron: "7 5 * * *"
    - cron: "37 5 * * *"
    # Après-midi : après le run AROME de 12 h UTC et les prix day-ahead
    - cron: "23 15 * * *"
    - cron: "53 16 * * *"
  workflow_dispatch:
  # Base des sites modifiée (nom, mode de valorisation, paramètres, nouveau site) : nouveau calcul
  push:
    branches: [main]
    paths: ["config/sites.json"]

permissions:
  contents: write

concurrency:
  group: prevision-pv
  cancel-in-progress: false

jobs:
  calcul:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calcul (réalisé, correction, prix, prévision J+1)
        env:
          ENPHASE_API_KEY: ${{ secrets.ENPHASE_API_KEY }}
          ENPHASE_CLIENT_ID: ${{ secrets.ENPHASE_CLIENT_ID }}
          ENPHASE_CLIENT_SECRET: ${{ secrets.ENPHASE_CLIENT_SECRET }}
          ENPHASE_REFRESH_TOKEN: ${{ secrets.ENPHASE_REFRESH_TOKEN }}
          ENPHASE_REFRESH_TOKEN_SORTIE: ${{ runner.temp }}/enphase_refresh_token
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          # Jetons MyElectricalData : 20 emplacements, attribués aux PRM par la page des sites
          ENEDIS_JETON_01: ${{ secrets.ENEDIS_JETON_01 }}
          ENEDIS_JETON_02: ${{ secrets.ENEDIS_JETON_02 }}
          ENEDIS_JETON_03: ${{ secrets.ENEDIS_JETON_03 }}
          ENEDIS_JETON_04: ${{ secrets.ENEDIS_JETON_04 }}
          ENEDIS_JETON_05: ${{ secrets.ENEDIS_JETON_05 }}
          ENEDIS_JETON_06: ${{ secrets.ENEDIS_JETON_06 }}
          ENEDIS_JETON_07: ${{ secrets.ENEDIS_JETON_07 }}
          ENEDIS_JETON_08: ${{ secrets.ENEDIS_JETON_08 }}
          ENEDIS_JETON_09: ${{ secrets.ENEDIS_JETON_09 }}
          ENEDIS_JETON_10: ${{ secrets.ENEDIS_JETON_10 }}
          ENEDIS_JETON_11: ${{ secrets.ENEDIS_JETON_11 }}
          ENEDIS_JETON_12: ${{ secrets.ENEDIS_JETON_12 }}
          ENEDIS_JETON_13: ${{ secrets.ENEDIS_JETON_13 }}
          ENEDIS_JETON_14: ${{ secrets.ENEDIS_JETON_14 }}
          ENEDIS_JETON_15: ${{ secrets.ENEDIS_JETON_15 }}
          ENEDIS_JETON_16: ${{ secrets.ENEDIS_JETON_16 }}
          ENEDIS_JETON_17: ${{ secrets.ENEDIS_JETON_17 }}
          ENEDIS_JETON_18: ${{ secrets.ENEDIS_JETON_18 }}
          ENEDIS_JETON_19: ${{ secrets.ENEDIS_JETON_19 }}
          ENEDIS_JETON_20: ${{ secrets.ENEDIS_JETON_20 }}
        run: |
          set -o pipefail
          mkdir -p data
          python -m prevpv.run quotidien 2>&1 | tee data/journal_dernier_calcul.log

      - name: Réenregistrer le jeton Enphase s'il a changé
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          f="$RUNNER_TEMP/enphase_refresh_token"
          [ -s "$f" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Enphase a fourni un nouveau jeton mais le secret SECRETS_PAT est absent : il faudra refaire l'initialisation Enphase."
            exit 0
          fi
          if gh secret set ENPHASE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" 2> "$RUNNER_TEMP/gh_err"; then
            echo "Jeton Enphase : renouvelé et réenregistré." | tee -a data/journal_dernier_calcul.log
          else
            vu=$(gh api "repos/$GITHUB_REPOSITORY" -q .full_name 2>&1 | head -c 200)
            echo "SECRETS_PAT voit le dépôt : $vu" | tee -a data/journal_dernier_calcul.log
            echo "Jeton Enphase : ÉCHEC du réenregistrement ($(head -c 300 "$RUNNER_TEMP/gh_err")). Vérifier SECRETS_PAT (droit Secrets : Read and write sur ce dépôt)." | tee -a data/journal_dernier_calcul.log
            exit 1
          fi

      - name: Publier les résultats
        if: always()
        run: |
          git config user.name "prevision-pv[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data docs/data
          git add -A data docs/data config/sites.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Calcul du $(TZ=Europe/Paris date '+%Y-%m-%d %Hh%M')"
          # Un autre calcul ou un enregistrement de la base a pu publier entre-temps : les fichiers
          # de résultats générés ici étant les plus récents, ils l'emportent en cas de conflit.
          for essai in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 10))
          done
          exit 1
